<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#F2545B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A1A10" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Lyric card, kept inside the adaptive-icon safe zone (centre ~600px) -->
  <g transform="translate(512 512) scale(0.9) translate(-512 -512) rotate(-8 512 512)" filter="url(#shadow)">
    <rect x="282" y="262" width="460" height="500" rx="64" fill="#FFFFFF"/>
    <!-- album cover with note -->
    <rect x="332" y="312" width="112" height="112" rx="26" fill="url(#cover)"/>
    <path d="M402 336 v52 a20 20 0 1 1 -14 -19 v-33 z" fill="#FFFFFF"/>
    <path d="M402 336 l22 8 v16 l-22 -8 z" fill="#FFFFFF"/>
    <!-- title / artist -->
    <rect x="470" y="330" width="210" height="28" rx="14" fill="#1E2A3A"/>
    <rect x="470" y="378" width="140" height="22" rx="11" fill="#1E2A3A" opacity="0.35"/>
    <!-- lyric lines -->
    <rect x="332" y="478" width="360" height="44" rx="22" fill="#1E2A3A"/>
    <rect x="332" y="552" width="300" height="44" rx="22" fill="#1E2A3A"/>
    <rect x="332" y="626" width="220" height="44" rx="22" fill="#1E2A3A"/>
  </g>
</svg>
